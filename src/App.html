<script>
(function () {
  'use strict';

  /* ============================ utilidades ============================ */
  var raiz = document.getElementById('raiz');
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function nb(s) {
    return String(s).replace(/R\$ (?=\d)/g, 'R$\u00A0').replace(/(\d) (ml|g|un|L|vendas|venda|copos|copo|números|número|%)(?![A-Za-zÀ-ú])/g, '$1\u00A0$2')
      .replace(/N\u00BA (\d)/g, 'N\u00BA\u00A0$1').replace(/c\u00F3digo (\d)/g, 'c\u00F3digo\u00A0$1').replace(/(\d) de (\d)/g, '$1\u00A0de\u00A0$2');
  }
  function milhar(s) { return String(s).replace(/\B(?=(\d{3})+(?!\d))/g, '.'); }
  function fmtN(n) { n = Math.round(n * 10) / 10; var p = Math.abs(n).toString().split('.'); return (n < 0 ? '\u2212' : '') + milhar(p[0]) + (p[1] ? ',' + p[1] : ''); }
  function fmtR(c) { var neg = c < 0, v = Math.abs(Math.round(c)), cc = String(v % 100); if (cc.length < 2) cc = '0' + cc; return (neg ? '\u2212' : '') + 'R$\u00A0' + milhar(Math.floor(v / 100)) + ',' + cc; }
  function fmtQ(n, un) { return nb(fmtN(n) + ' ' + un); }
  function pad4(n) { return String(n).padStart(4, '0'); }
  function uuid() {
    if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
    var h = '0123456789abcdef', s = ''; for (var i = 0; i < 36; i++) { if (i === 8 || i === 13 || i === 18 || i === 23) s += '-'; else if (i === 14) s += '4'; else s += h[Math.floor(Math.random() * 16)]; } return s;
  }
  var memoria = {};
  /* a pessoa também fica no endereço (?u=...), que o iPhone preserva; o armazenamento do navegador dentro do Google é apagado com frequência */
  function lerUrl(cb) {
    try { if (window.google && google.script && google.script.url && google.script.url.getLocation) { google.script.url.getLocation(function (loc) { cb((loc && loc.parameter && loc.parameter.u) || null); }); return; } } catch (e) {}
    try { cb(new URLSearchParams(window.location.search).get('u')); } catch (e) { cb(null); }
  }
  function gravarUrl(id) {
    try { if (window.google && google.script && google.script.history && google.script.history.replace) { google.script.history.replace(null, id ? { u: id } : {}, ''); return; } } catch (e) {}
    try { var u = new URL(window.location.href); if (id) u.searchParams.set('u', id); else u.searchParams.delete('u'); window.history.replaceState(null, '', u.toString()); } catch (e) {}
  }
  function ler(k) { try { return window.localStorage.getItem(k); } catch (e) { return memoria[k] || null; } }
  function guardar(k, v) { try { if (v == null) window.localStorage.removeItem(k); else window.localStorage.setItem(k, v); } catch (e) { if (v == null) delete memoria[k]; else memoria[k] = v; } }

  /* ============================ estado ============================ */
  var TITULOS = { venda: 'Venda', clientes: 'Clientes', preparo: 'Preparo', estoque: 'Estoque', paineis: 'Painéis', mais: 'Mais', compra: 'Compra', fechamento: 'Fechamento do dia', cadastros: 'Cadastros', financeiro: 'Financeiro', historico: 'Histórico', sistema: 'Sistema' };
  var SUBTELAS = ['compra', 'fechamento', 'cadastros', 'financeiro', 'historico', 'sistema'];
  var SUBS = {
    estoque: [['saldos', 'Saldos'], ['movs', 'Movimentos'], ['mexer', 'Ajustar / transferir']],
    cadastros: [['materiais', 'Materiais'], ['produtos', 'Produtos e preços'], ['receitas', 'Receitas'], ['listas', 'Listas'], ['promos', 'Promoções']],
    financeiro: [['resultado', 'Resultado e payback'], ['lanc', 'Lançamentos']],
    clientes: [['lista', 'Clientes'], ['clube', 'Clube'], ['sorteio', 'Sorteio']],
    paineis: [['geral', 'Geral'], ['dias', 'Dia a dia'], ['vendas', 'Vendas'], ['destino', 'Destino do café'], ['estoque', 'Estoque'], ['compras', 'Compras'], ['producao', 'Produção'], ['fin', 'Financeiro'], ['sorteio', 'Sorteio']]
  };
  var S = {
    cafeEm: ler('cafe_cafe_em') || 'colher',
    uid: null, user: null, usuarios: [], tela: 'venda', sub: { estoque: 'saldos', cadastros: 'materiais', financeiro: 'resultado', paineis: 'geral', clientes: 'lista' },
    v: {}, msg: null, ocupado: 0, ids: {}, seq: 0,
    cart: {}, pay: null, ticket: null, vs: { sim: false, n: 1, cliente: null, busca: '', res: [], total: 0, ativa: false },
    prep: { litros: 1, quem: null, plan: {}, aj: {}, ajTxt: {}, comMat: false, completando: null, mostraPlano: false, base: 'CAFE' }, recBase: 'CAFE', rd: {}, pend: 0, atualizar: false, desc: { aberto: false, txt: '', promo: null }, promoNova: '', compra: { mat: null, n: 1, valorTxt: '', valorManual: false, forn: null, corrige: null, novoLocal: '' },
    semCopo: false, vendedor: null, pessoa: '', periodo: 'hoje', mes: null, metrica: 'c', diaSel: null, est: { contar: null, abrir: null }, cli0: { todos: {} }, rec: null, lista: { novo: { fornecedor: '', forma_pagamento: '', motivo_perda: '' }, edit: null },
    perda: { ml: 50, motivo: null }, mov: { tipo: 'AJUSTE', mat: null, de: null, qtd: 0, txt: '0' }, lanc: { tipo: 'REEMBOLSO', uid: null, valor: 1000 },
    nm: { nome: '', un: 'g' }, cli: { q: '', nq: '', form: null }, zerar: false, novoSorteio: false, auditoria: null
  };

  /* ============================ comunicação ============================ */
  function chamar(nome, p) {
    p = p || {};
    return new Promise(function (ok, falha) {
      var json = JSON.stringify(p);
      if (window.google && google.script && google.script.run) {
        google.script.run.withSuccessHandler(function (r) { try { ok(JSON.parse(r)); } catch (e) { falha('Resposta inválida do servidor.'); } })
          .withFailureHandler(function (e) { falha((e && e.message) || 'Falha de comunicação.'); }).api(S.uid, nome, json);
      } else if (window.__apiLocal) {
        setTimeout(function () { try { ok(JSON.parse(window.__apiLocal(S.uid, nome, json))); } catch (e) { falha(e.message); } }, 0);
      } else {
        fetch('/api', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ uid: S.uid, nome: nome, p: p }) })
          .then(function (r) { return r.json(); }).then(ok).catch(function (e) { falha(e.message || 'Sem conexão.'); });
      }
    });
  }
  function chaveVista(q) { return q.tela + (SUBS[q.tela] ? ':' + q.sub : '') + (q.tela === 'paineis' ? ':' + q.periodo + (q.sub === 'dias' ? ':' + (q.mes || '') : '') + (q.pessoa ? ':p' + q.pessoa : '') : '') + (q.cid ? ':c' + q.cid : ''); }
  function consulta() { var t = S.tela, sub = S.sub[t]; var q = { tela: t, sub: sub }; if (t === 'clientes') { q.q = sub === 'sorteio' ? S.cli.nq : S.cli.q; if (sub === 'clube' && S.cli.det) q.cid = S.cli.det; } if (t === 'paineis') { q.periodo = S.periodo; if (sub === 'dias' && S.mes) q.mes = S.mes; if (S.pessoa && (sub === 'dias' || sub === 'vendas' || sub === 'destino')) q.pessoa = S.pessoa; } return q; }
  function V() { return S.v[chaveVista(consulta())] || null; }
  function guardarVista(q, view) { S.v[chaveVista(q)] = view; }

  function ocupar(f) { S.ocupado += f ? 1 : -1; if (S.ocupado < 0) S.ocupado = 0; }
  function aviso(txt, erro) { S.msg = { txt: txt, erro: !!erro }; }
  function sair(txt) { S.uid = null; S.user = null; S.vendedor = null; S.pessoa = ''; guardar('cafe_usuario', null); gravarUrl(null); S.v = {}; S.msg = txt ? { txt: txt, erro: true } : null; boot(); }

  function carregar() {
    if (S.tela === 'mais') { render(); return; }
    if (S.tela === 'clientes' && S.sub.clientes === 'form') { render(); return; }
    var q = consulta();
    ocupar(true); render();
    chamar('ver', q).then(function (r) {
      ocupar(false);
      if (r.sessao === false) return sair(r.erro);
      if (!r.ok) { aviso(r.erro, true); render(); return; }
      guardarVista(q, r); if (r.pend != null) S.pend = r.pend; S.atualizar = !!r.atualizar; iniciarFormularios(q.tela, r); render();
    }).catch(function (e) { ocupar(false); aviso('Sem conexão ou erro: ' + e, true); render(); });
  }

  /* executa uma ação no servidor e atualiza a tela atual na mesma chamada */
  function agir(nome, p, opc) {
    opc = opc || {};
    if (S.ocupado) return;
    var q = opc.semVista ? null : consulta();
    p = Object.assign({}, p); if (q) p._ver = q;
    ocupar(true); render();
    chamar(nome, p).then(function (r) {
      ocupar(false);
      if (r.sessao === false) return sair(r.erro);
      if (!r.ok) { aviso(r.erro, true); render(); return; }
      aviso(r.msg || 'Pronto.', false);
      if (r.pend != null) S.pend = r.pend; if (r.atualizar) S.atualizar = true;
      if (r.view && q) { guardarVista(q, r.view); iniciarFormularios(q.tela, r.view); }
      if (r.viewErro) aviso((r.msg || 'Pronto.') + ' (A tela não atualizou agora; abra de novo.)', false);
      if (opc.depois) opc.depois(r);
      render();
    }).catch(function (e) { ocupar(false); aviso('Sem conexão. Nada foi perdido: toque de novo para repetir.', true); render(); });
  }
  function idDe(tipo) { if (!S.ids[tipo]) S.ids[tipo] = uuid(); return S.ids[tipo]; }
  function limparId(tipo) { delete S.ids[tipo]; }

  /* valores iniciais dos formulários quando a tela chega */
  function iniciarFormularios(tela, v) {
    if (tela === 'venda') { if (S.pay !== 'consumo' && (!S.pay || !v.formas.some(function (f) { return f.id === S.pay; }))) S.pay = v.formas[0] && v.formas[0].id; }
    if (tela === 'preparo') { if (!S.prep.quem) S.prep.quem = S.user.id; }
    if (tela === 'cadastros' && S.rec === null) S.rec = S.user.id;
    if (tela === 'compra') {
      if (!S.compra.mat || !v.materiais.some(function (m) { return m.id === S.compra.mat; })) { S.compra.mat = v.materiais[0].id; S.compra.n = 1; S.compra.valorTxt = moedaTxt(v.materiais[0].precoPadrao); S.compra.valorManual = false; }
      if (!S.compra.valorTxt) S.compra.valorTxt = moedaTxt(v.materiais[0].precoPadrao * S.compra.n);
      if (!S.compra.forn || !v.fornecedores.some(function (f) { return f.id === S.compra.forn; })) S.compra.forn = v.fornecedores[0] && v.fornecedores[0].id;
    }
    if (tela === 'fechamento') { if (!S.perda.motivo && v.motivos.length) S.perda.motivo = v.motivos[0].id; if (S.perda.ml > Math.max(50, v.diff)) S.perda.ml = Math.max(50, Math.floor(v.diff / 50) * 50 || 50); }
    if (tela === 'estoque' && v.materiais) { if (!S.mov.mat) S.mov.mat = v.materiais[0].id; if (!S.mov.de) S.mov.de = S.user.id; }
    if (tela === 'financeiro' && v.usuarios) { if (!S.lanc.uid) S.lanc.uid = S.user.id; }
  }

  /* números digitados: aceita vírgula */
  function num(t) { var x = String(t == null ? '' : t).replace(/\s/g, '').replace('R$', '').replace(',', '.'); return x === '' || x === '-' ? NaN : Number(x); }
  function moedaTxt(c) { return (c / 100).toFixed(2).replace('.', ','); }
  function centsDe(t) { var n = num(t); return isNaN(n) ? NaN : Math.round(n * 100); }
  function r3(n) { return Math.round(n * 1000) / 1000; }
  function txtN(n) { return String(r3(n)).replace('.', ','); }

  /* ============================ blocos de tela ============================ */
  function chip(txt, on, a, v) { return '<button type="button" class="chip' + (on ? ' on' : '') + '" aria-pressed="' + (!!on) + '" data-a="' + a + '" data-v="' + esc(v) + '">' + esc(nb(txt)) + '</button>'; }
  function btn(txt, a, v, o) { o = o || {}; return '<button type="button" class="' + (o.cls || 'btn') + '"' + (o.dis ? ' disabled' : '') + ' data-a="' + a + '"' + (v != null ? ' data-v="' + esc(v) + '"' : '') + '>' + esc(nb(txt)) + '</button>'; }
  function ghost(txt, a, v) { return btn(txt, a, v, { cls: 'ghost' }); }
  function sb(txt, a, v, rot, p) { return '<button type="button" class="sb' + (p ? ' p' : '') + '" aria-label="' + esc(rot) + '" data-a="' + a + '" data-v="' + esc(v) + '">' + txt + '</button>'; }
  function step(txt, a, vMenos, vMais, rotMenos, rotMais, w) { return '<div class="step">' + sb('\u2212', a, vMenos, rotMenos) + '<span class="val"' + (w ? ' style="min-width:' + w + 'px"' : '') + '>' + esc(nb(txt)) + '</span>' + sb('+', a, vMais, rotMais, true) + '</div>'; }
  /* edição em rascunho: digita-se tudo e confirma uma vez em "Salvar" (nada é gravado a cada toque) */
  function rdChave(g, c) { return g + '|' + c; }
  function rdTxt(g, c, atual, fmt) { var k = rdChave(g, c); return k in S.rd ? S.rd[k] : (fmt ? fmt(atual) : txtN(atual)); }
  function rdSujo(g) { return Object.keys(S.rd).some(function (k) { return k.indexOf(g + '|') === 0; }); }
  function rdLimpar(g) { Object.keys(S.rd).forEach(function (k) { if (k.indexOf(g + '|') === 0) delete S.rd[k]; }); }
  function rdNum(g, c, atual) { var k = rdChave(g, c); return k in S.rd ? num(S.rd[k]) : atual; }
  function campo(g, c, rotulo, atual, un, fmt, texto) {
    var id = 'rd_' + (g + '_' + c).replace(/[^\w-]/g, '_');
    return '<div class="fld"><label class="lbl" for="' + id + '">' + esc(rotulo) + '</label><div class="fldin"><input id="' + id + '" class="inp" type="text" inputmode="' + (texto ? 'text' : 'decimal') + '" autocomplete="off" data-rd="1" data-g="' + esc(g) + '" data-c="' + esc(c) + '" value="' + esc(rdTxt(g, c, atual, fmt)) + '"' + (texto ? ' style="text-align:left;width:100%"' : '') + '>' + (un ? '<span class="un">' + esc(un) + '</span>' : '') + '</div></div>';
  }
  function barraSalvar(g, acao, v, extra) {
    return rdSujo(g) ? '<div class="row2">' + btn('Salvar', acao, v, { dis: S.ocupado }) + ghost('Descartar', 'rd-descartar', g) + (extra || '') + '</div>' : '';
  }

  /* contador com campo para digitar */
  function stepIn(id, valor, rot, a, vMenos, vMais, rotMenos, rotMais, w) {
    return '<div class="step">' + sb('\u2212', a, vMenos, rotMenos) + '<input id="' + id + '" data-i="' + id + '" class="inp" type="text" inputmode="decimal" autocomplete="off" aria-label="' + esc(rot) + '" value="' + esc(valor) + '" style="width:' + (w || 84) + 'px;min-width:0;text-align:center;padding-left:4px;padding-right:4px">' + sb('+', a, vMais, rotMais, true) + '</div>';
  }
  function card(h, cls, estilo) { return '<div class="card' + (cls ? ' ' + cls : '') + '"' + (estilo ? ' style="' + estilo + '"' : '') + '>' + h + '</div>'; }
  function lbl(t) { return '<div class="lbl">' + esc(nb(t)) + '</div>'; }
  function muted(t, cls) { return '<div class="muted' + (cls ? ' ' + cls : '') + '">' + esc(nb(t)) + '</div>'; }
  function linha(a, b) { return '<div class="row">' + a + b + '</div>'; }
  function entrada(id, valor, o) { o = o || {}; return '<input id="' + id + '" class="inp' + (o.cls ? ' ' + o.cls : '') + '" type="' + (o.tipo || 'text') + '" autocomplete="off"' + (o.ph ? ' placeholder="' + esc(o.ph) + '"' : '') + (o.modo ? ' inputmode="' + o.modo + '"' : '') + ' data-i="' + id + '" value="' + esc(valor) + '">'; }
  function rotulo(id, t) { return '<label class="lbl" for="' + id + '">' + esc(t) + '</label>'; }
  function corpo(h, rodape, cls) { return '<div class="body">' + h + '</div>' + (rodape ? '<div class="foot' + (cls ? ' ' + cls : '') + '">' + rodape + '</div>' : ''); }
  function carregando() { return '<div class="body">' + card(muted('Carregando\u2026')) + '</div>'; }
  function tiles(l) { return '<div class="tiles">' + l.map(function (x) { return '<div class="tile">' + lbl(x.lbl) + '<div class="tv">' + esc(x.val) + '</div></div>'; }).join('') + '</div>'; }
  function barras(l) { return '<div class="list">' + l.map(function (b) { return '<div><div class="row"><span class="nm">' + esc(b.lbl) + '</span><span class="nm">' + esc(b.val) + '</span></div><div class="bar"><i style="width:' + b.pct + '%"></i></div></div>'; }).join('') + '</div>'; }
  function linhasNum(l) { return l.map(function (n) { return 'N\u00BA ' + pad4(n.numero) + '   c\u00F3digo ' + n.token; }).join('\n'); }

  /* ============================ VENDA ============================ */
  function fixNb(html) { return html.replace(/>([^<]+)</g, function (m, t) { return '>' + nb(t) + '<'; }); }
  function parcial(id, html) { var el = document.getElementById(id); if (!el) return false; el.innerHTML = fixNb(html); return true; }
  function htmlResVenda() {
    var vs = S.vs;
    return vs.res.map(function (c, i) { return '<button type="button" class="res" data-a="vs-pick" data-v="' + i + '"><span class="nm">' + esc(c.nome) + '</span><span class="muted">' + esc(c.contato) + '</span></button>'; }).join('') +
      muted(!vs.ativa ? 'Digite o nome, telefone ou e-mail do cliente.' : !vs.res.length ? 'Nenhum cliente encontrado. Cadastre abaixo.' : vs.total > 3 ? 'Mostrando 3 de ' + vs.total + ': digite mais para refinar.' : '');
  }
  function totaisCarrinho(v) {
    var t = { copos: 0, ml: 0, serv: 0, cents: 0, menor: 0 };
    v.produtos.forEach(function (p) { var n = S.cart[p.id] || 0; if (!n) return; t.copos += n; t.ml += n * p.cafeMl; t.serv += n * p.tamanho; t.cents += n * p.preco; if (!t.menor || p.preco < t.menor) t.menor = p.preco; });
    return t;
  }
  /* desconto manual: o que está digitado, em centavos (0 se vazio) */
  function descontoCents() { var c = centsDe(S.desc.txt); return isNaN(c) ? (String(S.desc.txt).trim() === '' ? 0 : NaN) : Math.max(0, c); }
  function telaVenda() {
    var v = V(); if (!v) return carregando();
    var modoCons = S.pay === 'consumo', t = totaisCarrinho(v), vs = S.vs, nS = (v.sorteio && vs.sim && !modoCons) ? vs.n : 0, totS = nS * (v.sorteio ? v.sorteio.preco : 0), saldo = v.saldoMl;
    var h = '';
    if (S.ticket) {
      var nn = S.ticket.numeros;
      h += card(linha(lbl('Números do sorteio de ' + S.ticket.cliente + ' (' + nn.length + ')'), ghost('Ok', 'ticket-ok')) + '<div class="numbox"><div class="mono' + (nn.length > 10 ? ' cols' : '') + '">' + esc(linhasNum(nn)) + '</div></div>' + muted('Anote para o cliente: cada número tem o seu código.'), 'ticket');
    }
    if (S.sug) h += card('<div class="nm">' + esc(nb(S.sug.nome + ' já tomou ' + S.sug.copos + (S.sug.copos === 1 ? ' café' : ' cafés') + ' hoje.')) + '</div>' + muted('Dar 1 número do sorteio?') + '<div class="row2">' + btn('Dar número', 'num-dar', null, { dis: S.ocupado }) + ghost('Agora não', 'num-nao') + '</div>', 'ok');
    h += card('<div class="row">' + '<div>' + lbl('Café pronto hoje') + '<div class="big">' + esc(fmtQ(saldo, 'ml')) + '</div></div>' + '<div class="right">' + ghost('Fechar o dia', 'ir', 'fechamento') + (saldo <= 0 ? ghost('Registrar preparo', 'ir', 'preparo') : '') + '</div></div>' +
      (saldo < 0 ? muted('Vendeu ' + fmtN(-saldo) + ' ml a mais que o preparado. Registre o preparo que faltou ou ajuste no Fechamento.') : saldo === 0 ? muted('Sem café pronto. Registre um preparo antes de vender.') : ''), saldo <= 0 ? 'warn' : '');
    if (!modoCons && (v.usuarios || []).length > 1) h += card('<div class="row"><span class="lbl">Vendido por</span><div class="chips">' + v.usuarios.map(function (u) { return chip(u.nome, (S.vendedor || S.user.id) === u.id, 'vendedor', u.id); }).join('') + '</div></div>', S.vendedor && S.vendedor !== S.user.id ? 'warn' : '');   // laranja quando a venda vai para a outra pessoa
    h += '<div class="list">' + v.produtos.map(function (p) {
      var n = S.cart[p.id] || 0;
      return '<div class="prow' + (n > 0 ? ' sel' : '') + '"><div><div class="pn">' + esc(p.nome) + '</div>' + muted(nb(p.tamanho + ' ml \u00B7 ' + fmtR(p.preco))) + '</div>' +
        step(String(n), 'cart', p.id + '|-1', p.id + '|1', 'Tirar um ' + p.nome + ' de ' + p.tamanho + ' ml', 'Adicionar um ' + p.nome + ' de ' + p.tamanho + ' ml', 30) + '</div>';
    }).join('') + '</div>';
    var cliCard = '';
    if (vs.cliente) {
      var cc = vs.cliente, ch = cc.coposHoje || 0, nn2 = cc.nNumeros || 0;
      cliCard = '<div class="selcli"><div><div class="nm">' + esc(cc.nome) + '</div>' + muted(cc.contato + ' \u00B7 ' + ch + (ch === 1 ? ' café hoje' : ' cafés hoje') + ' \u00B7 ' + nn2 + (nn2 === 1 ? ' número' : ' números')) + '</div>' + ghost('Trocar', 'vs-trocar') + '</div>';
    } else if (vs.abrir) {

  function mesVizinho(m, n) { var a = Number(m.slice(0, 4)), b = Number(m.slice(5, 7)) - 1 + n; a += Math.floor(b / 12); b = ((b % 12) + 12) % 12; return a + '-' + String(b + 1).padStart(2, '0'); }

    'es-mat': function (v) { S.mov.mat = v; S.mov.qtd = 0; S.mov.txt = '0'; render(); },
    'es-de': function (v) { S.mov.de = v; render(); },
    'es-qtd': function (v) { var m = V().materiais.filter(function (x) { return x.id === S.mov.mat; })[0], q = S.mov.qtd + Number(v) * m.passo; if (S.mov.tipo === 'AJUSTE' || q >= 0) { S.mov.qtd = r3(q); S.mov.txt = txtN(S.mov.qtd); } render(); },
    'es-ok': function () { agir('estoque.mover', { id: idDe('mov'), tipo: S.mov.tipo, material_id: S.mov.mat, de: S.mov.de, qtd: S.mov.qtd }, { depois: function () { limparId('mov'); S.mov.qtd = 0; S.mov.txt = '0'; } }); },
    'es-min-salvar': function (id) {
      var l = V().linhas.filter(function (x) { return x.id === id; })[0], g = 'estmin|' + id, min = rdNum(g, 'min', l.min);
      if (isNaN(min) || min < 0) { aviso('Digite o estoque mínimo (0 ou mais).', true); render(); return; }
      agir('material.salvar', { id: id, estoque_minimo_qtd: min }, { depois: function () { rdLimpar(g); } });
    },
    'es-mais': function (v) { S.est.abrir = S.est.abrir === v ? null : v; render(); },
    'es-contar': function (v) { S.est.contar = { mat: v, uid: S.user.id, txt: '' }; render(); },
    'es-contar-uid': function (v) { S.est.contar.uid = v; render(); },
    'es-contar-nao': function () { S.est.contar = null; render(); },
    'es-contar-ok': function () { var c = S.est.contar; agir('estoque.contar', { id: idDe('contar'), material_id: c.mat, usuario_id: c.uid, contado: num(c.txt) }, { depois: function () { limparId('contar'); S.est.contar = null; } }); },
    'es-mexer': function (v) { S.mov.mat = v; S.mov.qtd = 0; S.mov.txt = '0'; S.sub.estoque = 'mexer'; S.msg = null; carregar(); },
    /* desfazer */
    'estornar': function (v) { var p = par(v); agir('estornar', { tabela: p[0], id: p[1] }); },
    /* cadastros */
    'nm-un': function (v) { S.nm.un = v; render(); },
    'nm-ok': function () { agir('material.salvar', { novo_id: idDe('material'), nome: S.nm.nome, unidade: S.nm.un }, { depois: function () { limparId('material'); S.nm.nome = ''; } }); },
    'mat-ativo': function (v) { var p = par(v); agir('material.salvar', { id: p[0], ativo: p[1] === '1' }); },
    'mat-controla': function (v) { var p = par(v); agir('material.salvar', { id: p[0], controla_estoque: p[1] === '1' }); },
    'mat-salvar': function (id) {
      var m = V().materiais.filter(function (x) { return x.id === id; })[0], g = 'mat|' + id;
      var min = m.controla ? rdNum(g, 'min', m.min) : m.min, pac = m.controla ? rdNum(g, 'pacote', m.pacote) : m.pacote, reais = rdNum(g, 'preco', m.preco / 100), nome = (rdChave(g, 'nome') in S.rd) ? String(S.rd[rdChave(g, 'nome')]).trim() : m.nome;
      if (isNaN(min) || isNaN(pac) || isNaN(reais) || min < 0 || pac <= 0 || reais < 0) { aviso('Confira os números: use só dígitos (a vírgula vale); o pacote precisa ser maior que zero.', true); render(); return; }
      if (nome.length < 2) { aviso('Digite o nome do material.', true); render(); return; }
      agir('material.salvar', { id: id, nome: nome, estoque_minimo_qtd: min, pacote_qtd: pac, preco_padrao_centavos: Math.round(reais * 100) }, { depois: function () { rdLimpar(g); } });
    },
    'rd-descartar': function (g) { rdLimpar(g); render(); },
    'comp-copo': function (v) { var p = par(v); S.rd[rdChave('comp|' + p[0], 'copo')] = p[1]; render(); },
    'prod-salvar': function (id) {
      var p = V().produtos.filter(function (x) { return x.id === id; })[0], g = 'prod|' + id, reais = rdNum(g, 'preco', p.preco / 100), tam = rdNum(g, 'tam', p.tamanho);
      if (isNaN(reais) || reais < 0.01) { aviso('Digite o preço em reais (a partir de 0,01).', true); render(); return; }
      if (isNaN(tam) || tam < 20 || tam > 1000) { aviso('O tamanho do copo deve ficar entre 20 e 1.000 ml.', true); render(); return; }
      agir('variante.salvar', { variante_id: id, tamanho_ml: Math.round(tam), preco_centavos: Math.round(reais * 100) }, { depois: function () { rdLimpar(g); } });
    },
    'var-ativo': function (v) { var p = par(v); agir('variante.ativo', { id: p[0], ativo: p[1] === '1' }); },
    'rec-salvar': function () {
      var escId = S.rec === 'casa' || !S.rec ? '' : S.rec, e = V().escopos.filter(function (x) { return x.id === escId; })[0] || V().escopos[0], comLeite = S.recBase === 'CAFE_LEITE', r = comLeite ? e.receitaLeite : e.receita, g = 'rec|' + (e.id || 'casa') + '|' + (comLeite ? 'leite' : 'cafe');
      var gAc0 = r.gPorColherAcucar || 10, campos = ['colheres_por_litro', 'g_por_colher', 'filtros_por_litro', 'agua_ml_por_litro', 'leite_ml_por_litro', 'g_por_colher_acucar', 'g_por_colher_canela', 'acucar_colheres'];
      var atual = { colheres_por_litro: r.colheres, g_por_colher: r.gPorColher, filtros_por_litro: r.filtros, agua_ml_por_litro: r.agua, leite_ml_por_litro: r.leite || 0, g_por_colher_acucar: gAc0, g_por_colher_canela: r.gPorColherCanela || 3, acucar_colheres: r3(r.acucar / gAc0) };
      var o = { usuario_id: e.id || null, base: comLeite ? 'CAFE_LEITE' : 'CAFE' }, v = {};
      campos.forEach(function (k) { v[k] = rdNum(g, k, atual[k]); });
      var bad = campos.some(function (k) { return isNaN(v[k]) || v[k] < 0; });
      if (bad || v.colheres_por_litro <= 0 || v.g_por_colher <= 0 || v.g_por_colher_acucar <= 0 || v.g_por_colher_canela <= 0) { aviso('Confira os números: use só dígitos (a vírgula vale). Café e gramas de cada colher precisam ser maiores que zero; filtro, açúcar, água e leite podem ser 0.', true); render(); return; }
      ['colheres_por_litro', 'g_por_colher', 'filtros_por_litro', 'agua_ml_por_litro', 'leite_ml_por_litro', 'g_por_colher_acucar', 'g_por_colher_canela'].forEach(function (k) { o[k] = v[k]; });
      o.acucar_g_por_litro = r3(v.acucar_colheres * v.g_por_colher_acucar);   // o sistema guarda gramas; a colher é só a forma de informar
      agir('receita.salvar', o, { depois: function () { rdLimpar(g); } });
    },
    'comp-salvar': function (id) {
      var c = V().composicao.filter(function (x) { return x.id === id; })[0], g = 'comp|' + id, canela = rdNum(g, 'canela_g', c.canelaG);
      if (isNaN(canela) || canela < 0) { aviso('Confira os números do copo.', true); render(); return; }
      agir('composicao.salvar', { variante_id: id, canela_g: canela, copo_material_id: S.rd[rdChave(g, 'copo')] || c.copoId }, { depois: function () { rdLimpar(g); } });
    },
    'cfg-salvar': function () {
      var v = V(), g = 'cfg|sorteio', meta = rdNum(g, 'meta', v.meta);
      if (isNaN(meta)) { aviso('Confira os números do sorteio.', true); render(); return; }
      agir('config.salvar', { itens: { 'sorteio.meta_numeros': meta } }, { depois: function () { rdLimpar(g); } });
    },
    'rec-escopo': function (v) { S.rec = v; render(); },
    'rec-base': function (v) { S.recBase = v; render(); },
    'rec-padrao': function () { agir('receita.padrao', { usuario_id: S.rec, base: S.recBase }); },
    'lst-add': function (v) { agir('lista.salvar', { tabela: v, novo_id: idDe('lista-' + v), nome: S.lista.novo[v] }, { depois: function () { limparId('lista-' + v); S.lista.novo[v] = ''; } }); },
    'lst-ativo': function (v) { var p = par(v); agir('lista.salvar', { tabela: p[0], id: p[1], ativo: p[2] === '1' }); },
    'lst-edit': function (v) { var p = par(v), L = V().listas.filter(function (x) { return x.tabela === p[0]; })[0], i = L.itens.filter(function (x) { return x.id === p[1]; })[0]; S.lista.edit = { tabela: p[0], id: p[1], nome: i.nome }; render(); },
    'lst-edit-ok': function () { var e = S.lista.edit; agir('lista.salvar', { tabela: e.tabela, id: e.id, nome: e.nome }, { depois: function () { S.lista.edit = null; } }); },
    'lst-edit-nao': function () { S.lista.edit = null; render(); },
    'promo-ativo': function (v) { var p = par(v); agir('promocao.salvar', { id: p[0], ativo: p[1] === '1' }); },
    'promo-add': function () { agir('promocao.salvar', { novo_id: idDe('promo'), nome: S.promoNova }, { depois: function () { limparId('promo'); S.promoNova = ''; } }); },
    /* financeiro */
    'lanc-tipo': function (v) { S.lanc.tipo = v; render(); },
    'lanc-uid': function (v) { S.lanc.uid = v; render(); },
    'lanc-val': function (v) { S.lanc.valor = Math.max(100, S.lanc.valor + Number(v)); render(); },
    'lanc-ok': function () { agir('financeiro.lancar', { id: idDe('lanc'), tipo: S.lanc.tipo, usuario_id: S.lanc.uid, valor_centavos: S.lanc.valor }, { depois: function () { limparId('lanc'); } }); },
    /* clientes */
    'cli-novo': function () { S.cli.form = { id: '', nome: '', tel: '', email: '', volta: '' }; S.sub.clientes = 'form'; S.msg = null; render(); },
    'cli-editar': function (v) { var c = V().clientes.filter(function (x) { return x.id === v; })[0]; S.cli.form = { id: c.id, nome: c.nome, tel: c.telefone, email: c.email, volta: '' }; S.sub.clientes = 'form'; S.msg = null; render(); },
    'cli-voltar': function () { var volta = S.cli.form && S.cli.form.volta; S.cli.form = null; if (volta === 'venda') { S.tela = 'venda'; carregar(); } else { S.sub.clientes = 'lista'; carregar(); } },
    'cli-salvar': function () {
      var f = S.cli.form, volta = f.volta;
      agir('cliente.salvar', { id: f.id || null, novo_id: idDe('cliente'), nome: f.nome, telefone: f.tel, email: f.email }, {
        semVista: true,
        depois: function (r) {
          limparId('cliente'); S.cli.form = null; S.sub.clientes = 'lista';
          if (volta === 'venda') { chamar('cliente.mascarado', { id: r.cliente_id }).then(function (m) { if (m.ok && m.cliente) { restaurarVenda(m.cliente); aviso(r.msg + ' Cliente ligado à venda.', false); render(); } }); }
          else carregar();
        }
      });
    },
    'cli-todos': function (v) { S.cli0.todos[v] = !S.cli0.todos[v]; var el = document.getElementById('cli-res'); if (el && V()) { el.innerHTML = fixNb(htmlResClientes(V())); } else render(); },
    'cli-abrir': function (v) { S.cli.det = v; S.cli.motivo = null; carregar(); },
    'cli-fechar': function () { S.cli.det = null; S.cli.motivo = null; carregar(); },
    'cli-motivo-salvar': function () { agir('cliente.motivo', { id: S.cli.det, motivo: S.cli.motivo }, { depois: function () { S.cli.motivo = null; } }); },
    'cli-dar': function (v) { agir('numero.dar', { id: idDe('numero'), cliente_id: v, motivo: 'Dado à mão' }, { depois: function () { limparId('numero'); } }); },
    'cli-dar-det': function () { agir('numero.dar', { id: idDe('numero'), cliente_id: S.cli.det, motivo: 'Dado à mão' }, { depois: function () { limparId('numero'); } }); },
    'num-cancelar': function (v) { agir('numero.cancelar', { id: v }); },
    'cli-ativo': function (v) { var p = par(v); agir('cliente.ativo', { id: p[0], ativo: p[1] === '1' }); },
    'cli-vender': function (v) { var c = V().clientes.filter(function (x) { return x.id === v; })[0]; chamar('cliente.mascarado', { id: c.id }).then(function (m) { if (m.ok && m.cliente) { restaurarVenda(m.cliente); } }); },
    'ns-pedir': function () { S.novoSorteio = true; render(); },
    'ns-nao': function () { S.novoSorteio = false; render(); },
    'ns-sim': function () { agir('sorteio.novo', { id: idDe('sorteio') }, { depois: function () { limparId('sorteio'); S.novoSorteio = false; } }); },
    'auditar': function () { ocupar(true); render(); chamar('sistema.auditar').then(function (r) { ocupar(false); S.auditoria = r.ok ? r : null; if (!r.ok) aviso(r.erro, true); render(); }).catch(function (e) { ocupar(false); aviso('Falha: ' + e, true); render(); }); },
    /* quem é você neste aparelho */
    'escolher': function (v) {
      S.uid = v; guardar('cafe_usuario', v); gravarUrl(v); S.msg = null; ocupar(true); render();
      chamar('sessao').then(function (r) {
        ocupar(false);
        if (!r.ok || r.sessao === false) { S.uid = null; S.user = null; guardar('cafe_usuario', null); gravarUrl(null); aviso(r.erro || 'Pessoa inválida.', true); render(); return; }
        S.user = r.usuario; S.tela = 'venda'; S.msg = null; carregar();
      }).catch(function (e) { ocupar(false); S.uid = null; S.user = null; aviso('Sem conexão: ' + e, true); render(); });
    },
    'repetir': function () { S.msg = null; boot(); }
  };

  var ENTRADAS = {
    'vs-busca': function (v) { S.vs.busca = v; buscarClienteVenda(); },
    'cli-q': function (v) { S.cli.q = v; recarregarClientes(); },
    'cli-motivo': function (v) { S.cli.motivo = v; var b = document.querySelector('[data-a="cli-motivo-salvar"]'); var d = V() && V().detalhe; if (b && d) b.disabled = String(v).trim() === d.motivo; },
    'nq-busca': function (v) { S.cli.nq = v; recarregarClientes(); },
    'cli-nome': function (v) { S.cli.form.nome = v; }, 'cli-tel': function (v) { S.cli.form.tel = v; }, 'cli-email': function (v) { S.cli.form.email = v; },
    'nm-nome': function (v) { S.nm.nome = v; },
    'promo-nova': function (v) { S.promoNova = v; },
    'vs-n-in': function (v) { var d = String(v).replace(/\D/g, ''); if (d === '') return; S.vs.n = Math.max(1, Math.min(99, parseInt(d, 10))); render(); },
    'cp-n-in': function (v) { var d = String(v).replace(/\D/g, ''); if (d === '') return; definirEmbalagens(parseInt(d, 10)); render(); },
    'cp-val-in': function (v) { S.compra.valorTxt = v; S.compra.valorManual = true; render(); },
    'cp-novo-local': function (v) { S.compra.novoLocal = v; var b = document.querySelector('[data-a="cp-add-local"]'); if (b) b.disabled = v.trim().length < 2; },
    'es-contado': function (v) { S.est.contar.txt = v; render(); },
    'es-qtd-in': function (v) { S.mov.txt = v; var n = num(v); S.mov.qtd = isNaN(n) ? 0 : n; render(); },
    'lst-edit': function (v) { S.lista.edit.nome = v; }
  };

  document.addEventListener('click', function (e) {
    var el = e.target.closest ? e.target.closest('[data-a]') : null;
    if (!el || el.disabled) return;
    var a = el.getAttribute('data-a'), v = el.getAttribute('data-v');
    if (S.ocupado && a !== 'msg-ok' && a !== 'sair') return;
    if (ACOES[a]) ACOES[a](v);
  });
  document.addEventListener('input', function (e) {
    var id = e.target && e.target.getAttribute && e.target.getAttribute('data-i');
    if (id && ENTRADAS[id]) ENTRADAS[id](e.target.value);
    else if (id && id.indexOf('lst-novo-') === 0) S.lista.novo[id.slice(9)] = e.target.value;
    else if (e.target && e.target.getAttribute && e.target.getAttribute('data-g') === 'desc|venda') { S.desc.txt = e.target.value; render(); }
    else if (e.target && e.target.hasAttribute && e.target.hasAttribute('data-rd')) { S.rd[rdChave(e.target.getAttribute('data-g'), e.target.getAttribute('data-c'))] = e.target.value; render(); }
    else if (id && id.indexOf('pa_') === 0) {
      var mid = id.slice(3), txt = e.target.value, n = num(txt), md = medidaCafe(V(), mid); S.prep.ajTxt[mid] = txt;
      if (!isNaN(n) && n >= 0) { if (md.colher) n = r3(n * md.g); var padrao = calcAtual(V()).c[mid] || 0; if (Math.abs(n - padrao) < 1e-9) delete S.prep.aj[mid]; else S.prep.aj[mid] = n; }
      render();
    }
  });

  function iniciarCom(id, daUrl) {
    S.uid = id; S.user = null; render();
    chamar('sessao').then(function (r) {
      if (r.ok && r.usuario) { guardar('cafe_usuario', id); gravarUrl(id); S.user = r.usuario; carregar(); }
      else { S.uid = null; S.user = null; guardar('cafe_usuario', null); gravarUrl(null); boot(true); }
    }).catch(function (e) { S.uid = null; S.user = null; S.usuarios = []; aviso('Sem conexão. Verifique a internet e tente de novo.', true); render(); });
  }
  function boot(semUrl) {
    S.tela = 'venda';
    var guardado = ler('cafe_usuario');
    if (guardado) { iniciarCom(guardado); return; }
    function escolher() {
      S.uid = null; S.user = null; render();
      chamar('publico').then(function (r) { S.usuarios = r.usuarios || []; render(); }).catch(function () { S.usuarios = []; aviso('Sem conexão. Verifique a internet e tente de novo.', true); render(); });
    }
    if (semUrl) { escolher(); return; }
    lerUrl(function (u) { if (u) iniciarCom(u, true); else escolher(); });
  }
  window.__cafe = { S: S, ACOES: ACOES, render: render };
  boot();
})();
</script>
