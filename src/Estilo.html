<style>
body{margin:0}
button,input,select{font-family:inherit}
.app{box-sizing:border-box;container-type:inline-size;container-name:app;overflow:hidden;width:100%;height:100vh;height:100dvh;background:#F6EFE6;color:#2A1A12;font-family:'Outfit',system-ui,sans-serif}
.shell{width:100%;height:100%;display:flex;flex-direction:column}

/* ---- topo: título à esquerda, pessoa pequena à direita ---- */
.top{grid-area:top;padding:8px 12px 4px;display:flex;align-items:center;justify-content:space-between;gap:8px;flex-shrink:0}
.tl{display:flex;align-items:center;gap:6px;min-width:0}
.back{width:36px;height:36px;border:1px solid #CDB9A6;border-radius:10px;background:#FFFDF9;color:#2A1A12;font-size:24px;line-height:1;cursor:pointer;flex-shrink:0}
.brand{font-family:'JetBrains Mono',ui-monospace,monospace;font-size:10px;letter-spacing:.12em}
.h1{margin:0;font-size:20px;font-weight:700;line-height:1.1}
.usr{display:flex;align-items:center;background:#FFFDF9;border:1px solid #E4D6C8;border-radius:999px;padding:2px;flex-shrink:0}
.u{min-height:28px;padding:0 10px;border:0;border-radius:999px;background:transparent;color:#6B5547;font-size:12px;font-weight:600;cursor:pointer}
.u.on{background:#2A1A12;color:#FFFDF9;display:flex;align-items:center}
.subbar{grid-area:sub;gap:6px;padding:0 12px 6px;overflow-x:auto;flex-shrink:0}
.subbar .chip{min-height:32px;padding:0 12px;font-size:13px}

.scr{grid-area:main;flex:1;min-height:0;display:flex;flex-direction:column}
.body{flex:1;min-height:0;overflow-y:auto;padding:2px 12px 10px;display:flex;flex-direction:column;gap:8px}
.sec{display:flex;flex-direction:column;gap:8px}
.dc{display:contents}
.col{display:flex;flex-direction:column;gap:6px}
.foot{flex-shrink:0;padding:8px 12px 10px;background:#FFFDF9;border-top:1px solid #E4D6C8;display:flex;flex-direction:column;gap:6px}
.foot.slim{padding:7px 12px;text-align:center}

/* ---- cartões e textos ---- */
.card{padding:10px 12px;background:#FFFDF9;border:1px solid #E4D6C8;border-radius:14px;display:flex;flex-direction:column;gap:6px}
.card.warn{background:#FFF1E4;border-color:#E8B994}
.card.ok{background:#E6F1E8;border-color:#A9CDB0}
.lbl{font-size:12px;font-weight:600;color:#6B5547}
.muted{font-size:12px;color:#6B5547;line-height:1.35}
.big{font-size:24px;font-weight:700;line-height:1.05}
.mid{font-size:16px;font-weight:700}
.tot{font-size:20px;font-weight:700;line-height:1;white-space:nowrap;flex-shrink:0}
.nm{font-size:15px;font-weight:600}
.pn{font-size:15px;font-weight:600}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px}
.rows{display:flex;flex-direction:column}
.list{display:flex;flex-direction:column;gap:6px}
.it{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:7px 0;border-top:1px solid #E4D6C8}
.it > div:first-child{min-width:0}
.right{display:flex;flex-direction:column;align-items:flex-end;gap:4px}

/* ---- botões ---- */
.btn{width:100%;min-height:44px;border:0;border-radius:12px;background:#2A1A12;color:#FFFDF9;font-size:16px;font-weight:600;cursor:pointer}
.btn:disabled{background:#E4D6C8;color:#5B4A3E;cursor:default}
.ghost{min-height:34px;padding:0 12px;border:1px solid #CDB9A6;border-radius:10px;background:#FFFDF9;color:#2A1A12;font-size:13px;font-weight:600;cursor:pointer;flex-shrink:0}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{min-height:36px;padding:0 12px;border:1px solid #CDB9A6;border-radius:10px;background:#FFFDF9;color:#2A1A12;font-size:14px;font-weight:600;cursor:pointer;flex-shrink:0}
.chip.on{background:#2A1A12;color:#FFFDF9;border-color:#2A1A12}
.chips.pay{flex-wrap:nowrap}
.chips.pay .chip{flex:1;min-height:34px;padding:0 6px;font-size:13px}
.step{display:flex;align-items:center;gap:4px;flex-shrink:0}
.sb{width:36px;height:36px;border:1px solid #CDB9A6;border-radius:10px;background:#FFFDF9;color:#2A1A12;font-size:20px;font-weight:600;cursor:pointer;padding:0}
.sb.p{background:#2A1A12;color:#FFFDF9;border-color:#2A1A12}
.val{min-width:44px;text-align:center;font-size:16px;font-weight:700}
.inp{width:100%;box-sizing:border-box;min-height:42px;padding:0 12px;border:1px solid #CDB9A6;border-radius:10px;background:#FFFDF9;color:#2A1A12;font-size:16px}
.step .inp{min-height:36px}
.prow{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:5px 8px 5px 12px;border:1px solid #E4D6C8;border-radius:14px;background:#FFFDF9}
.prow.sel{background:#FFF1E4}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.tile{padding:9px 10px;background:#FFFDF9;border:1px solid #E4D6C8;border-radius:12px}
.tv{font-size:17px;font-weight:700;margin-top:1px}
.trio{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.bar{height:7px;border-radius:5px;background:#E4D6C8;overflow:hidden;margin-top:3px}
.bar i{display:block;height:100%;background:#A8481A;border-radius:5px}
.tag{display:inline-block;padding:2px 7px;border-radius:7px;background:#EFE3D6;font-size:10.5px;font-weight:700;letter-spacing:.04em;color:#5B4A3E}
.tag.pend{background:#FFE3C7;color:#8A3A12}
.tag.okk{background:#DCEBDD;color:#1F4F2C}
.tag.err{background:#F8D9D3;color:#8F2A1A}
.neg{color:#9A2A14}
.struck{text-decoration:line-through;color:#8C7566}
.msg{grid-area:msg;flex-shrink:0;margin:0 12px 6px;padding:4px 4px 4px 12px;border-radius:12px;background:#E6F1E8;color:#1F4F2C;font-size:13px;font-weight:600;align-items:center;justify-content:space-between;gap:8px}
.msg button{min-height:32px;padding:0 12px;border:1px solid #1F4F2C;border-radius:9px;background:transparent;color:#1F4F2C;font-size:13px;font-weight:600;cursor:pointer}
.mrow{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;min-height:52px;padding:8px 12px;border:1px solid #E4D6C8;border-radius:14px;background:#FFFDF9;color:#2A1A12;text-align:left;cursor:pointer}
.chev{font-size:24px;color:#A8481A}
.nav{grid-area:nav;display:flex;flex-shrink:0;background:#FFFDF9;border-top:1px solid #E4D6C8;padding-bottom:env(safe-area-inset-bottom,0px)}
.nb{position:relative;flex:1;min-width:0;padding:0 2px;min-height:54px;border:0;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:10.5px;font-weight:600;color:#6B5547;cursor:pointer}
.nb svg{width:22px;height:22px}
.bdg{position:absolute;top:3px;left:calc(50% + 6px);min-width:16px;height:16px;padding:0 4px;box-sizing:border-box;border-radius:8px;background:#A8481A;color:#fff;font-size:10px;font-weight:700;line-height:16px;text-align:center}
.aviso-topo{margin:0 12px 6px;padding:6px 10px;border-radius:10px;background:#FFF1E4;border:1px solid #E8B994;color:#8A3A12;font-size:12px;font-weight:600;flex-shrink:0}
.tag.pend{display:inline-block;margin-top:2px}
.nb.on{color:#A8481A}
.mid,.val,.tv{white-space:nowrap}
.mid{flex-shrink:0}
.tag{white-space:nowrap}
.mono{font-family:'JetBrains Mono',ui-monospace,monospace;font-size:12px;white-space:pre;line-height:1.6;color:#2A1A12;max-height:220px;overflow:auto}
.mono.cols{column-count:2;column-gap:16px}
.numbox{padding:8px 10px;border-radius:10px;background:#F6EFE6;display:flex;flex-direction:column;gap:2px}
.ticket{border-color:#A9CDB0;background:#E6F1E8}
.res{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;min-height:44px;padding:6px 12px;border:1px solid #CDB9A6;border-radius:10px;background:#FFFDF9;color:#2A1A12;text-align:left;cursor:pointer}
.selcli{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 10px;border-radius:10px;background:#F6EFE6}
.row2{display:flex;gap:8px}
.row2 > .btn,.row2 > .ghost{flex:1;min-width:0;width:auto;padding:0 8px;min-height:38px;font-size:14px}
.yn{display:flex;gap:6px}
.yn .chip{flex:1;min-height:34px}
.yn.sm{flex:0 0 150px}
.fld{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:6px 0;border-top:1px solid #E4D6C8}
.fld .lbl{flex:1;min-width:0}
.fldin{display:flex;align-items:center;gap:6px;flex-shrink:0}
.fldin .inp{width:104px;min-height:38px;text-align:right}
.un{font-size:12px;color:#6B5547;min-width:22px}
.stepun{display:flex;align-items:center;gap:4px;flex-shrink:0}
.addlinha{display:flex;gap:8px;align-items:stretch}
.addlinha .inp{flex:1;min-width:0}
.addlinha .btn{width:auto;flex:none;padding-left:16px;padding-right:16px;min-height:42px}
.carga{position:fixed;top:0;left:0;height:3px;width:35%;background:#A8481A;z-index:50;animation:vai 1s ease-in-out infinite}
@keyframes vai{0%{left:-35%}100%{left:100%}}
.login{min-height:100vh;min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:20px;background:#F6EFE6;color:#2A1A12;font-family:'Outfit',system-ui,sans-serif;box-sizing:border-box}
.login .card{width:100%;max-width:380px}
.erro{color:#9A2A14;font-weight:600}
.msg.erro{background:#F8D9D3;color:#8F2A1A}
.msg.erro button{border-color:#8F2A1A;color:#8F2A1A}

@container app (max-width: 359px){
  .nb{font-size:10px;letter-spacing:-0.2px}
  .chips.pay .chip{font-size:12px}
}

/* ---- computador: menu à esquerda e uma coluna de leitura (sem grade quebrada) ---- */
@container app (min-width: 840px){
  .shell{display:grid;grid-template-columns:200px minmax(0,1fr);grid-template-rows:auto auto auto minmax(0,1fr);grid-template-areas:"nav top" "nav sub" "nav msg" "nav main"}
  .top{padding:16px 28px 6px}
  .h1{font-size:24px}
  .subbar{padding:0 28px 10px}
  .msg{margin:0 28px 8px;max-width:720px}
  .nav{flex-direction:column;justify-content:flex-start;gap:4px;padding:18px 10px;border-top:0;border-right:1px solid #E4D6C8}
  .nb{flex:0 0 auto;flex-direction:row;justify-content:flex-start;gap:10px;min-height:40px;padding:0 12px;font-size:14px;border-radius:10px}
  .nb.on{background:#F6EFE6}
  .nb .bdg{position:static;margin-left:auto}
  .aviso-topo{margin:0 28px 8px;max-width:720px}
  .body{padding:4px 28px 20px;align-items:stretch}
  .body > *{width:100%;max-width:720px;box-sizing:border-box}
  .body > .sec,.body > .wide,.body > .tiles{max-width:1040px}
  .body > .tiles{grid-template-columns:repeat(4,minmax(0,1fr))}
  .sec{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:10px;align-items:start}
  .sec > .ghost,.sec > .btn{grid-column:1 / -1;justify-self:start;width:auto;min-width:0}
  .sec > .full,.sec > .tiles{grid-column:1 / -1}
  .sec > .btn{padding:0 24px;min-width:220px}
  .cap{max-width:760px}
  .foot{align-items:flex-start;padding:10px 28px}
  .foot > *{width:100%;max-width:720px;box-sizing:border-box}
  .foot.slim{text-align:left}
  .btn{width:auto;min-width:240px;padding:0 24px}
  .foot > .btn{width:100%}
}
</style>
