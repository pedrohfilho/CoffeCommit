<style>
body{margin:0}
button,input,select{font-family:inherit}
.app{box-sizing:border-box;container-type:inline-size;container-name:app;overflow:hidden;width:100%;height:100vh;height:100dvh;background:#F6EFE6;color:#2A1A12;font-family:'Outfit',system-ui,sans-serif}
.shell{width:100%;height:100%;display:flex;flex-direction:column}
.top{grid-area:top;padding:12px 14px 6px;display:flex;align-items:center;justify-content:space-between;gap:8px;flex-shrink:0}
.tl{display:flex;align-items:center;gap:6px;min-width:0}
.back{width:44px;height:44px;border:1px solid #CDB9A6;border-radius:12px;background:#FFFDF9;color:#2A1A12;font-size:28px;line-height:1;cursor:pointer;flex-shrink:0}
.brand{font-family:'JetBrains Mono',ui-monospace,monospace;font-size:11px;letter-spacing:.12em}
.h1{margin:2px 0 0;font-size:24px;font-weight:700;line-height:1.1}
.usr{display:flex;background:#FFFDF9;border:1px solid #E4D6C8;border-radius:999px;padding:2px;flex-shrink:0}
.u{min-height:44px;padding:0 14px;border:0;border-radius:999px;background:transparent;color:#2A1A12;font-size:14px;font-weight:600;cursor:pointer}
.u.on{background:#2A1A12;color:#FFFDF9}
.subbar{grid-area:sub;gap:6px;padding:0 14px 8px;overflow-x:auto;flex-shrink:0}
.scr{grid-area:main;flex:1;min-height:0;display:flex;flex-direction:column}
.body{flex:1;min-height:0;overflow-y:auto;padding:4px 14px 12px;display:flex;flex-direction:column;gap:10px}
.sec{display:flex;flex-direction:column;gap:10px}
.dc{display:contents}
.col{display:flex;flex-direction:column;gap:8px}
.foot{flex-shrink:0;padding:10px 14px 12px;background:#FFFDF9;border-top:1px solid #E4D6C8;display:flex;flex-direction:column;gap:8px}
.card{padding:14px;background:#FFFDF9;border:1px solid #E4D6C8;border-radius:16px;display:flex;flex-direction:column;gap:8px}
.card.warn{background:#FFF1E4;border-color:#E8B994}
.card.ok{background:#E6F1E8;border-color:#A9CDB0}
.lbl{font-size:13px;font-weight:600;color:#6B5547}
.muted{font-size:13px;color:#6B5547;line-height:1.35}
.big{font-size:32px;font-weight:700;line-height:1.05}
.mid{font-size:19px;font-weight:700}
.tot{font-size:26px;font-weight:700;line-height:1;white-space:nowrap;flex-shrink:0}
.nm{font-size:16px;font-weight:600}
.pn{font-size:17px;font-weight:600}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px}
.rows{display:flex;flex-direction:column}
.list{display:flex;flex-direction:column;gap:8px}
.it{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:9px 0;border-top:1px solid #E4D6C8}
.right{display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.btn{width:100%;min-height:48px;border:0;border-radius:14px;background:#2A1A12;color:#FFFDF9;font-size:17px;font-weight:600;cursor:pointer}
.btn:disabled{background:#E4D6C8;color:#5B4A3E;cursor:default}
.ghost{min-height:44px;padding:0 14px;border:1px solid #CDB9A6;border-radius:12px;background:#FFFDF9;color:#2A1A12;font-size:15px;font-weight:600;cursor:pointer;flex-shrink:0}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{min-height:44px;padding:0 14px;border:1px solid #CDB9A6;border-radius:12px;background:#FFFDF9;color:#2A1A12;font-size:15px;font-weight:600;cursor:pointer;flex-shrink:0}
.chip.on{background:#2A1A12;color:#FFFDF9;border-color:#2A1A12}
.step{display:flex;align-items:center;gap:4px;flex-shrink:0}
.sb{width:44px;height:44px;border:1px solid #CDB9A6;border-radius:12px;background:#FFFDF9;color:#2A1A12;font-size:22px;font-weight:600;cursor:pointer}
.sb.p{background:#2A1A12;color:#FFFDF9;border-color:#2A1A12}
.val{min-width:70px;text-align:center;font-size:18px;font-weight:700}
.inp{width:100%;box-sizing:border-box;min-height:48px;padding:0 12px;border:1px solid #CDB9A6;border-radius:12px;background:#FFFDF9;color:#2A1A12;font-size:17px}
.prow{display:flex;align-items:center;justify-content:space-between;padding:8px 10px 8px 14px;border:1px solid #E4D6C8;border-radius:16px;background:#FFFDF9}
.prow.sel{background:#FFF1E4}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.tile{padding:12px;background:#FFFDF9;border:1px solid #E4D6C8;border-radius:14px}
.tv{font-size:20px;font-weight:700;margin-top:2px}
.trio{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.bar{height:10px;border-radius:6px;background:#E4D6C8;overflow:hidden;margin-top:5px}
.bar i{display:block;height:100%;background:#A8481A;border-radius:6px}
.tag{display:inline-block;padding:3px 8px;border-radius:8px;background:#EFE3D6;font-size:11px;font-weight:700;letter-spacing:.04em;color:#5B4A3E}
.tag.pend{background:#FFE3C7;color:#8A3A12}
.tag.okk{background:#DCEBDD;color:#1F4F2C}
.tag.err{background:#F8D9D3;color:#8F2A1A}
.neg{color:#9A2A14}
.struck{text-decoration:line-through;color:#8C7566}
.msg{grid-area:msg;flex-shrink:0;margin:0 14px 8px;padding:6px 6px 6px 12px;border-radius:12px;background:#E6F1E8;color:#1F4F2C;font-size:14px;font-weight:600;align-items:center;justify-content:space-between;gap:8px}
.msg button{min-height:44px;padding:0 14px;border:1px solid #1F4F2C;border-radius:10px;background:transparent;color:#1F4F2C;font-size:14px;font-weight:600;cursor:pointer}
.mrow{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;min-height:60px;padding:10px 14px;border:1px solid #E4D6C8;border-radius:16px;background:#FFFDF9;color:#2A1A12;text-align:left;cursor:pointer}
.chev{font-size:26px;color:#A8481A}
.nav{grid-area:nav;display:flex;flex-shrink:0;background:#FFFDF9;border-top:1px solid #E4D6C8;padding-bottom:env(safe-area-inset-bottom,0px)}
.nb{flex:1;min-width:0;padding:0 2px;min-height:60px;border:0;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;font-weight:600;color:#6B5547;cursor:pointer}
.nb.on{color:#A8481A}
.mid,.val,.tv{white-space:nowrap}
.mid{flex-shrink:0}
.tag{white-space:nowrap}
.mono{font-family:'JetBrains Mono',ui-monospace,monospace;font-size:13px;white-space:pre;line-height:1.7;color:#2A1A12}
.numbox{padding:10px 12px;border-radius:12px;background:#F6EFE6;display:flex;flex-direction:column;gap:2px}
.ticket{border-color:#A9CDB0;background:#E6F1E8}
.res{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;min-height:48px;padding:8px 12px;border:1px solid #CDB9A6;border-radius:12px;background:#FFFDF9;color:#2A1A12;text-align:left;cursor:pointer}
.selcli{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 12px;border-radius:12px;background:#F6EFE6}
.row2{display:flex;gap:8px}
.row2 > .btn,.row2 > .ghost{flex:1;min-width:0;width:auto;padding:0 8px;min-height:44px;font-size:15px}
.yn{display:flex;gap:6px}
.yn .chip{flex:1}
@container app (max-width: 359px){
  .nb{font-size:10px;letter-spacing:-0.2px}
}
@container app (min-width: 840px){
  .shell{display:grid;grid-template-columns:232px minmax(0,1fr);grid-template-rows:auto auto auto minmax(0,1fr);grid-template-areas:"nav top" "nav sub" "nav msg" "nav main"}
  .top{padding:22px 28px 10px}
  .h1{font-size:28px}
  .subbar{padding:0 28px 12px}
  .msg{margin:0 28px 10px}
  .nav{flex-direction:column;justify-content:flex-start;gap:6px;padding:24px 12px;border-top:0;border-right:1px solid #E4D6C8}
  .nb{flex:0 0 auto;flex-direction:row;justify-content:flex-start;gap:12px;min-height:48px;padding:0 14px;font-size:15px;border-radius:12px}
  .nb.on{background:#F6EFE6}
  .body{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;align-items:start;align-content:start;padding:4px 28px 24px}
  .body > .sec,.body > .tiles,.body > .wide{grid-column:1 / -1}
  .body > .tiles{grid-template-columns:repeat(4,minmax(0,1fr))}
  .rspan3{grid-column:2;grid-row:1 / span 4}
  .cap{max-width:760px}
  .sec{flex-direction:row;flex-wrap:wrap;align-items:flex-start;gap:14px}
  .sec > *{flex:1 1 340px;min-width:0}
  .sec > .card{max-width:calc(50% - 7px)}
  .sec > .ghost{flex:1 1 100%;max-width:240px}
  .sec > .btn{flex:0 0 auto}
  .foot{flex-direction:row;flex-wrap:wrap;align-items:center;gap:12px;padding:14px 28px}
  .foot > .card{flex:1 1 100%}
  .foot > .row{flex:1 1 240px}
  .foot > .msg{flex:1 1 100%;margin:0}
  .btn{width:auto;min-width:260px;padding:0 28px}
}
@container app (min-width: 1500px){
  .sec > .card{max-width:calc(33.333% - 10px)}
}

.addlinha{display:flex;gap:8px;align-items:stretch}
.addlinha .inp{flex:1;min-width:0}
.addlinha .btn{width:auto;flex:none;padding-left:16px;padding-right:16px}
.carga{position:fixed;top:0;left:0;height:3px;width:35%;background:#A8481A;z-index:50;animation:vai 1s ease-in-out infinite}
@keyframes vai{0%{left:-35%}100%{left:100%}}
.login{min-height:100vh;min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:20px;background:#F6EFE6;color:#2A1A12;font-family:'Outfit',system-ui,sans-serif;box-sizing:border-box}
.login .card{width:100%;max-width:380px}
.pin{letter-spacing:.35em;text-align:center;font-size:24px}
.erro{color:#9A2A14;font-weight:600}
.msg.erro{background:#F8D9D3;color:#8F2A1A}
.msg.erro button{border-color:#8F2A1A;color:#8F2A1A}
.cap2{font-size:12px;color:#6B5547}
@container app (min-width: 840px){ .ghost.sair{margin-left:8px} }
</style>
